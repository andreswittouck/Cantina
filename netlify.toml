# Configuración de Netlify. Manda sobre lo que esté cargado en el panel
# (Project configuration → Build & deploy), así el build no depende de eso.

[build]
  # Sin esto Netlify no compila: publica la carpeta del proyecto tal cual y el
  # sitio da "Page not found" (pasó en el primer deploy).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 pide Node 20.9 o más nuevo.
  NODE_VERSION = "22"

# El adaptador de Next.js para Netlify (OpenNext). Sin versión fija: Netlify
# usa siempre la última, que es lo que recomiendan.
[[plugins]]
  package = "@netlify/plugin-nextjs"
